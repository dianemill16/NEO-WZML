<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ file_name }} — NEO-WZML</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px;
      background: #0e1117; color: #e6edf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 900px; background: #161b22;
      border: 1px solid #30363d; border-radius: 14px; overflow: hidden;
    }
    .media { background: #000; display: flex; justify-content: center; }
    video, audio { width: 100%; max-height: 70vh; display: block; }
    .none { padding: 48px 24px; text-align: center; color: #8b949e; }
    .meta { padding: 18px 20px; }
    h1 { margin: 0 0 6px; font-size: 1.05rem; font-weight: 600; word-break: break-word; }
    .size { color: #8b949e; font-size: .85rem; margin-bottom: 16px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    a.btn {
      flex: 1 1 160px; text-align: center; text-decoration: none;
      padding: 11px 16px; border-radius: 9px; font-size: .9rem; font-weight: 600;
      border: 1px solid #30363d; color: #e6edf3; background: #21262d;
    }
    a.btn.primary { background: #238636; border-color: #2ea043; }
    a.btn:hover { filter: brightness(1.15); }
    code {
      display: block; margin-top: 14px; padding: 10px 12px; background: #0d1117;
      border: 1px solid #30363d; border-radius: 8px; font-size: .78rem;
      color: #8b949e; word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="media">
      {% if is_video %}
        <video controls preload="metadata" playsinline>
          <source src="{{ stream_url }}" type="{{ mime_type }}" />
        </video>
      {% elif is_audio %}
        <audio controls preload="metadata">
          <source src="{{ stream_url }}" type="{{ mime_type }}" />
        </audio>
      {% else %}
        <div class="none">No inline preview for this file type.</div>
      {% endif %}
    </div>
    <div class="meta">
      <h1>{{ file_name }}</h1>
      <div class="size">{{ (file_size / 1048576) | round(2) }} MB &middot; {{ mime_type }}</div>
      <div class="actions">
        <a class="btn primary" href="{{ download_url }}">Download</a>
        <a class="btn" href="{{ stream_url }}">Direct stream link</a>
      </div>
      <code id="abs"></code>
    </div>
  </div>
  <script>
    document.getElementById('abs').textContent =
      new URL('{{ stream_url }}', location.href).href;
  </script>
</body>
</html>
